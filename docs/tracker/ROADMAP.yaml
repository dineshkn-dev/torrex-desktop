# Forward-looking roadmap. Shipped work is documented in docs/specs/PRODUCT.md and CHANGELOG.md.
version: 2
project: torrin
released_version: "0.1.0"

milestones:
  - id: v1-0-production-macos
    name: v1.0 — Production macOS distribution
    status: planned
    spec: docs/planning/FUTURE.md#production-macos
    items:
      - id: M-100-developer-id-signing
        summary: Sign app and DMG with Developer ID Application certificate
        priority: high
      - id: M-101-notarization
        summary: Notarize and staple release DMG for Gatekeeper
        priority: high
      - id: M-102-auto-update
        summary: Evaluate Sparkle or equivalent update channel
        priority: medium

  - id: v1-1-cross-platform
    name: v1.1 — Windows and Linux releases
    status: planned
    spec: docs/planning/FUTURE.md#cross-platform
    items:
      - id: M-200-windows-ci-package
        summary: Windows CI build and windeployqt packaging
        priority: high
      - id: M-201-linux-ci-package
        summary: Linux CI build and AppImage or deb package
        priority: high
      - id: M-202-ci-matrix
        summary: Restore multi-OS CI matrix from macOS-only v0.1 scope
        priority: medium

  - id: v1-2-torrent-advanced
    name: v1.2 — Advanced torrent features
    status: planned
    spec: docs/planning/FUTURE.md#torrent-advanced
    items:
      - id: M-300-per-file-progress
        summary: Per-file download progress in Files tab
        priority: medium
      - id: M-301-selective-download
        summary: Choose files before starting download
        priority: high
      - id: M-302-tracker-editor
        summary: View and edit trackers on active torrents
        priority: low
      - id: M-303-watch-folder
        summary: Auto-add torrents from a watched directory
        priority: medium

  - id: v1-x-ui-polish
    name: UI polish and native integration
    status: in_progress
    spec: docs/planning/FUTURE.md#ui-polish
    items:
      - id: M-399-telegram-ui-revamp
        summary: Telegram-inspired layout, design tokens, list/detail panes
        priority: high
        status: done
      - id: M-400-native-notifications
        summary: macOS notification center for completed downloads
        priority: medium
      - id: M-401-tray-menubar
        summary: Menu bar icon and background controls
        priority: low
      - id: M-402-list-search-sort
        summary: Search and sort torrent list
        priority: medium
