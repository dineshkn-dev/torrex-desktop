      - id: M-110-list-search
        summary: Search torrent list by name, hash, or path
        priority: high
        status: done
      - id: M-111-list-sort
        summary: Sort list by name or date created
        priority: high
        status: done
      - id: M-112-list-eta
        summary: Show ETA or Paused/Done in torrent rows
        priority: medium
        status: done
      - id: M-113-reveal-in-finder
        summary: Reveal download folder or file in Finder
        priority: high
        status: done
      - id: M-114-copy-magnet
        summary: Copy magnet URI for selected torrent
        priority: medium
        status: done
      - id: M-116-pause-resume-all
        summary: Global pause all and resume all controls
        priority: high
        status: done
      - id: M-117-disk-space-display
        summary: Free-space line on download volume in list status bar
        priority: medium
        status: done
      - id: M-120-keyboard-shortcuts
        summary: Shortcuts for pause, remove, search, navigation
        priority: medium
        status: done

