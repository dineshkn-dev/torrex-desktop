name: Feature request
description: Suggest an improvement for Torrin
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/planning/FUTURE.md](https://github.com/dineshkn-dev/torrin/blob/main/docs/planning/FUTURE.md) and [ROADMAP](https://github.com/dineshkn-dev/torrin/blob/main/docs/tracker/ROADMAP.yaml) before filing — your idea may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (current)
        - Windows (planned)
        - Linux (planned)
        - All platforms
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: This is not already covered in FUTURE.md or ROADMAP.yaml
          required: false
