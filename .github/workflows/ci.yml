name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/*.sh && ./scripts/validate-docs.sh

  build:
    name: ${{ matrix.os }}
    needs: validate-docs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: ci-release
          - os: windows-2022
            preset: ci-release
          - os: ubuntu-24.04
            preset: ci-release

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg/bincache,read;files,${{ github.workspace }}/vcpkg/bincache,write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja autoconf autoconf-archive automake libtool pkg-config

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ninja autoconf automake libtool -y

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 8528134bac3d39db8d36f4097755a97a1394e4dc

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/bincache
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/build/ci-release/vcpkg_installed
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Check core has no Qt
        if: runner.os != 'Windows'
        run: chmod +x scripts/check-core-no-qt.sh && ./scripts/check-core-no-qt.sh
