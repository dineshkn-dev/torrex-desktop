name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/*.sh && ./scripts/validate-docs.sh

  # macOS-only while v0.1 targets the Mac app (Qt via vcpkg is slow to build).
  # Re-enable windows/ubuntu matrix when cross-platform release is in scope.
  build-macos:
    name: macos-14
    needs: validate-docs
    runs-on: macos-14
    timeout-minutes: 120

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg/bincache,read;files,${{ github.workspace }}/vcpkg/bincache,write

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS build dependencies
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 8528134bac3d39db8d36f4097755a97a1394e4dc

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/bincache
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/build/ci-release/vcpkg_installed
          key: vcpkg-macos14-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-macos14-

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release

      - name: Test
        run: ctest --preset ci-release --output-on-failure

      - name: Check core has no Qt
        run: chmod +x scripts/check-core-no-qt.sh && ./scripts/check-core-no-qt.sh
