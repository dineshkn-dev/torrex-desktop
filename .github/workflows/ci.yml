name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: chmod +x scripts/*.sh && ./scripts/validate-docs.sh

  build:
    name: ${{ matrix.os }}
    needs: validate-docs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: ci-release
          - os: windows-2022
            preset: ci-release
          - os: ubuntu-24.04
            preset: ci-release

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 8528134bac3d39db8d36f4097755a97a1394e4dc

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Check core has no Qt
        if: runner.os != 'Windows'
        run: ./scripts/check-core-no-qt.sh
