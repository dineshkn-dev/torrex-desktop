name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/robots.txt"
      - "docs/sitemap.xml"
      - "docs/torrinindexnow2026.txt"
      - "docs/assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify search engines (IndexNow)
        if: success()
        run: |
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "dineshkn-dev.github.io",
              "key": "torrinindexnow2026",
              "keyLocation": "https://dineshkn-dev.github.io/torrin/torrinindexnow2026.txt",
              "urlList": [
                "https://dineshkn-dev.github.io/torrin/"
              ]
            }'
          curl -fsS "https://www.bing.com/indexnow?url=https://dineshkn-dev.github.io/torrin/&key=torrinindexnow2026" || true
